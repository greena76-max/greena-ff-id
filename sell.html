<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell Free Fire ID</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>💰 Sell Your Free Fire ID</h1>

<form id="sellForm">

<input type="text" id="sellerName" placeholder="Your Name" required><br><br>

<input type="text" id="whatsapp" placeholder="WhatsApp Number" required><br><br>

<input type="text" id="uid" placeholder="Free Fire UID" required><br><br>

<input type="text" id="level" placeholder="Level" required><br><br>

<input type="text" id="rank" placeholder="Rank" required><br><br>

<select id="loginType">
<option>Google</option>
<option>Facebook</option>
<option>VK</option>
<option>Twitter</option>
</select><br><br>

<input type="text" id="price" placeholder="Price" required><br><br>

<input type="text" id="screenshot" placeholder="Screenshot Link"><br><br>

<button type="submit">Submit</button>

</form>

<br>

<a href="index.html" class="buy">🏠 Home</a>

</div>

<script src="script.js"></script>

</body>
</html>
