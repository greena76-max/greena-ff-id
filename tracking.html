<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order Status - FF STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f17;
            --card-bg: rgba(18, 24, 38, 0.75);
            --primary: #ff1e4b;
            --primary-hover: #e00034;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 30, 75, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(255, 30, 75, 0.12), transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.05), transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: rgba(11, 15, 23, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--primary);
        }

        .back-home-btn {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .back-home-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .track-container {
            width: 100%;
            max-width: 480px;
            margin: 60px auto 40px;
            padding: 0 20px;
        }

        .track-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border-radius: 20px;
            padding: 36px 28px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .track-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .track-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .track-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .track-input {
            width: 100%;
            background: rgba(11, 15, 23, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: #ffffff;
            outline: none;
            text-align: center;
            font-weight: 600;
            transition: all 0.2s;
        }

        .track-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 30, 75, 0.15);
            background: rgba(11, 15, 23, 0.9);
        }

        .search-btn {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 30, 75, 0.25);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .search-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(255, 30, 75, 0.35);
        }

        /* FINTECH STYLE RESULT BOX */
        .result-box {
            margin-top: 24px;
            padding: 20px;
            border-radius: 16px;
            background: rgba(11, 15, 23, 0.7);
            border: 1px solid var(--border);
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-badge-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-approved {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-pending {
            background: var(--warning-bg);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .details-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .detail-val {
            color: #ffffff;
            font-weight: 600;
        }

        .mono-code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--primary);
            border: 1px solid rgba(255, 30, 75, 0.2);
        }

        .price-val {
            color: var(--success);
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .view-store-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.875rem;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .view-store-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        footer {
            width: 100%;
            border-top: 1px solid var(--border);
            padding: 20px;
            text-align: center;
            margin-top: auto;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">⚡ <span>FF STORE</span></a>
        <a href="index.html" class="back-home-btn">Main Store</a>
    </header>

    <div class="track-container">
        <div class="track-card">
            <div class="track-header">
                <h1 class="track-title">Track Ad Status</h1>
                <p class="track-subtitle">Enter Tracking ID or Free Fire UID to verify live status</p>
            </div>

            <form id="trackForm" class="input-group">
                <input type="text" id="trackInput" class="track-input" placeholder="e.g. TRK-43364 or 1378051678" required>
                <button type="submit" class="search-btn" id="searchBtn">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    Search Status
                </button>
            </form>

            <div id="resultBox" class="result-box">
                <!-- Loaded via JS -->
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 FF STORE. All rights reserved.</p>
    </footer>

    <script>
        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxTNb36wRmt9K47cqS2sUa-4TqSZdzr_LzINKDN14MdHRB7VON2-K4tOyfiUwMMQXMeNSr8hxe06SO/pub?output=csv';

        document.getElementById('trackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = document.getElementById('trackInput').value.trim().toLowerCase();
            const btn = document.getElementById('searchBtn');
            const resultBox = document.getElementById('resultBox');

            if(!query) return;

            btn.innerHTML = 'Searching...';
            btn.style.opacity = '0.7';

            fetch(sheetCsvUrl)
                .then(res => res.text())
                .then(csvText => {
                    const rows = csvText.split('\n').map(r => r.split(','));
                    let found = null;

                    for (let i = 1; i < rows.length; i++) {
                        const r = rows[i];
                        if (r.length >= 3) {
                            const rawTracking = r[8] ? r[8].trim() : '';
                            const trackingId = rawTracking.toLowerCase();
                            const uid = r[2] ? r[2].trim().toLowerCase() : '';

                            if ((trackingId && trackingId === query) || (uid && uid === query)) {
                                let formattedTrackingId = rawTracking;
                                if (rawTracking.includes('http') || rawTracking.length > 15) {
                                    formattedTrackingId = 'TRK-' + Math.floor(10000 + Math.random() * 90000);
                                }

                                found = {
                                    name: r[0] ? r[0].trim() : 'N/A',
                                    uid: r[2] ? r[2].trim() : 'N/A',
                                    level: r[3] ? r[3].trim() : 'N/A',
                                    price: r[6] ? r[6].trim() : 'N/A',
                                    trackingId: formattedTrackingId,
                                    status: 'APPROVED & LIVE'
                                };
                                break;
                            }
                        }
                    }

                    resultBox.style.display = 'block';

                    if (found) {
                        resultBox.innerHTML = `
                            <div class="status-badge-wrap">
                                <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Status</span>
                                <span class="status-badge badge-approved">
                                    <span class="dot"></span> Approved & Live
                                </span>
                            </div>
                            <div class="details-grid">
                                <div class="detail-row">
                                    <span class="detail-label">Tracking ID</span>
                                    <span class="detail-val mono-code">${found.trackingId}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Account UID</span>
                                    <span class="detail-val">${found.uid}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Seller Name</span>
                                    <span class="detail-val">${found.name}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Price</span>
                                    <span class="detail-val price-val">Rs. ${found.price}</span>
                                </div>
                            </div>
                            <a href="index.html" class="view-store-btn">View Live Listing in Store →</a>
                        `;
                    } else {
                        resultBox.innerHTML = `
                            <div class="status-badge-wrap">
                                <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Status</span>
                                <span class="status-badge badge-pending">
                                    <span class="dot"></span> Under Review
                                </span>
                            </div>
                            <div class="details-grid">
                                <div class="detail-row">
                                    <span class="detail-label">Search Query</span>
                                    <span class="detail-val mono-code">${query.toUpperCase()}</span>
                                </div>
                            </div>
                            <p style="font-size:0.8rem; color:var(--text-muted); margin-top:12px; text-align:center;">Your listing is currently being verified by our moderators.</p>
                        `;
                    }

                    btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg> Search Status`;
                    btn.style.opacity = '1';
                })
                .catch(err => {
                    resultBox.style.display = 'block';
                    resultBox.innerHTML = `<div style="color: var(--primary); font-size: 0.85rem; text-align: center;">Unable to fetch data. Please try again.</div>`;
                    btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg> Search Status`;
                    btn.style.opacity = '1';
                });
        });
    </script>
</body>
</html>
