<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order Status - FF STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --accent-red: #e60000;
            --red-gradient: linear-gradient(135deg, #ff1a1a 0%, #990000 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            padding: 15px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            background: var(--red-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .back-link {
            text-decoration: none;
            color: #555;
            font-weight: 600;
            font-size: 0.9rem;
            background: #eef2f6;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
        }

        .track-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 30px 25px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: var(--red-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.88rem;
            color: #666;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .form-control:focus {
            border-color: var(--accent-red);
        }

        .track-btn {
            width: 100%;
            background: var(--red-gradient);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        /* Result Status Styles */
        .status-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            text-align: left;
        }

        .status-box.show { display: block; }

        .status-pending { background: #fffbebfb; border: 1px solid #fef3c7; color: #b45309; }
        .status-approved { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
        .status-rejected { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .badge-pending { background: #f59e0b; color: #fff; }
        .badge-approved { background: #22c55e; color: #fff; }
        .badge-rejected { background: #ef4444; color: #fff; }

        .info-item {
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #334155;
        }

        .info-item strong { color: #0f172a; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🔥 FF STORE</div>
        <a href="index.html" class="back-link">← Back to Shop</a>
    </header>

    <div class="main-container">
        <div class="track-card">
            <h1 class="title">TRACK YOUR AD</h1>
            <p class="subtitle">Enter your Tracking ID to check status</p>

            <div class="form-group">
                <input type="text" id="trackingInput" class="form-control" placeholder="e.g. TRK-84920" required>
            </div>
            <button class="track-btn" onclick="checkStatus()" id="trackBtn">Track Status</button>

            <!-- STATUS DISPLAY BOX -->
            <div id="statusBox" class="status-box">
                <div id="statusBadge" class="status-badge">PENDING</div>
                <div class="info-item"><strong>Tracking ID:</strong> <span id="resTrackId">-</span></div>
                <div class="info-item"><strong>FF UID:</strong> <span id="resUid">-</span></div>
                <div class="info-item"><strong>Level:</strong> <span id="resLevel">-</span></div>
                <div class="info-item"><strong>Status Msg:</strong> <span id="resMsg">-</span></div>
            </div>
        </div>
    </div>

    <script>
        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxTNb36wRmt9K47cqS2sUa-4TqSZdzr_LzINKDN14MdHRB7VON2-K4tOyfiUwMMQXMeNSr8hxe06SO/pub?output=csv';

        async function checkStatus() {
            const inputVal = document.getElementById('trackingInput').value.trim().toUpperCase();
            const btn = document.getElementById('trackBtn');
            const box = document.getElementById('statusBox');

            if(!inputVal) {
                alert('Please enter your Tracking ID!');
                return;
            }

            btn.innerText = 'Searching...';
            btn.disabled = true;

            try {
                const res = await fetch(sheetCsvUrl + '&t=' + new Date().getTime());
                const text = await res.text();
                const rows = text.split('\n').slice(1);
                
                let found = false;

                rows.forEach(row => {
                    const cols = row.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                    
                    // Assuming Tracking ID in Column 11 (index 10) or matching anywhere
                    const trackingId = cols[10] ? cols[10].toUpperCase() : '';
                    const uid = cols[2];
                    const level = cols[3];
                    const status = cols[9] ? cols[9].toLowerCase() : 'pending';

                    if (trackingId === inputVal || uid === inputVal) {
                        found = true;
                        box.className = 'status-box show';
                        
                        document.getElementById('resTrackId').innerText = trackingId || inputVal;
                        document.getElementById('resUid').innerText = uid;
                        document.getElementById('resLevel').innerText = level;

                        const badge = document.getElementById('statusBadge');
                        const msg = document.getElementById('resMsg');

                        if(status === 'approved') {
                            box.classList.add('status-approved');
                            badge.className = 'status-badge badge-approved';
                            badge.innerText = 'APPROVED & LIVE';
                            msg.innerText = 'Aap ki ad website par live ho chuki hai!';
                        } else if(status === 'rejected') {
                            box.classList.add('status-rejected');
                            badge.className = 'status-badge badge-rejected';
                            badge.innerText = 'REJECTED';
                            msg.innerText = 'Payment proof ya ID details incorrect hain. Admin se WhatsApp par rabta karein.';
                        } else {
                            box.classList.add('status-pending');
                            badge.className = 'status-badge badge-pending';
                            badge.innerText = 'PENDING';
                            msg.innerText = 'Aap ki ad check ho rahi hai. 1-2 ghante mein approve ho jaye gi.';
                        }
                    }
                });

                if(!found) {
                    alert('Tracking ID nahi mili! Check karke dobara daalein.');
                    box.className = 'status-box';
                }

            } catch (err) {
                alert('Error fetching status. Please try again.');
            }

            btn.innerText = 'Track Status';
            btn.disabled = false;
        }
    </script>
</body>
</html>
