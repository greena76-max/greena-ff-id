<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order Status - FF STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --accent-red: #ff003c;
            --dark-red: #990022;
            --neon-green: #00ff88;
            --green-glow: rgba(0, 255, 136, 0.4);
            --red-glow: rgba(255, 0, 60, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0d1117;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 0, 60, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 255, 136, 0.1) 0px, transparent 50%),
                repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.01) 0, rgba(255, 255, 255, 0.01) 15px, transparent 15px, transparent 30px);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.6);
            text-decoration: none;
            letter-spacing: 1.5px;
        }

        .back-home-btn {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .back-home-btn:hover {
            background: var(--accent-red);
            border-color: var(--accent-red);
            box-shadow: 0 0 15px var(--red-glow);
        }

        .track-container {
            width: 100%;
            max-width: 480px;
            margin: 40px auto 30px;
            padding: 0 20px;
        }

        .track-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 32px 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .track-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff003c, #00ff88);
        }

        .track-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .track-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .track-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 1rem;
            color: #ffffff;
            outline: none;
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .track-input:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 15px var(--red-glow);
            background: rgba(0, 0, 0, 0.6);
        }

        .search-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff003c 0%, #990022 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 25px var(--red-glow);
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 0, 60, 0.6);
        }

        /* NEXT-LEVEL RESULT CARD */
        .result-box {
            margin-top: 25px;
            padding: 22px;
            border-radius: 20px;
            background: rgba(10, 15, 26, 0.85);
            border: 1px solid rgba(0, 255, 136, 0.25);
            display: none;
            text-align: left;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            animation: cyberPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cyberPop {
            0% { opacity: 0; transform: scale(0.92) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .status-badge-wrap {
            margin-bottom: 16px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .badge-approved {
            background: rgba(0, 255, 136, 0.12);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 15px var(--green-glow);
        }

        .badge-pending {
            background: rgba(255, 170, 0, 0.12);
            color: #ffaa00;
            border: 1px solid #ffaa00;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
            animation: neonPulse 1.2s infinite alternate;
        }

        @keyframes neonPulse {
            from { opacity: 0.4; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        .details-grid {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.92rem;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .detail-val {
            color: #ffffff;
            font-weight: 700;
        }

        .tracking-code-highlight {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-red);
            background: rgba(255, 0, 60, 0.12);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 60, 0.3);
            letter-spacing: 1.5px;
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.2);
        }

        .price-highlight {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-green);
            font-size: 1.05rem;
            text-shadow: 0 0 8px var(--green-glow);
        }

        .status-msg-success {
            margin-top: 16px;
            padding: 12px;
            background: rgba(0, 255, 136, 0.06);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px;
            color: var(--neon-green);
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .view-store-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .view-store-btn:hover {
            border-color: var(--neon-green);
            background: rgba(0, 255, 136, 0.15);
            color: var(--neon-green);
            box-shadow: 0 0 20px var(--green-glow);
            transform: translateY(-2px);
        }

        footer {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px;
            text-align: center;
            margin-top: auto;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">⚡ FF STORE</a>
        <a href="index.html" class="back-home-btn">🏠 Main Store</a>
    </header>

    <div class="track-container">
        <div class="track-card">
            <h2 class="track-title">Track Ad Status</h2>
            <p class="track-subtitle">Enter Tracking ID or Free Fire UID to fetch live status</p>

            <form id="trackForm">
                <input type="text" id="trackInput" class="track-input" placeholder="TRK-XXXXX or UID" required>
                <button type="submit" class="search-btn" id="searchBtn">🔍 SEARCH STATUS</button>
            </form>

            <div id="resultBox" class="result-box">
                <!-- Loaded Dynamically -->
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 FF STORE. Built for Gamers.</p>
    </footer>

    <script>
        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxTNb36wRmt9K47cqS2sUa-4TqSZdzr_LzINKDN14MdHRB7VON2-K4tOyfiUwMMQXMeNSr8hxe06SO/pub?output=csv';

        document.getElementById('trackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = document.getElementById('trackInput').value.trim().toLowerCase();
            const btn = document.getElementById('searchBtn');
            const resultBox = document.getElementById('resultBox');

            if(!query) return;

            btn.innerText = 'SEARCHING...';
            btn.style.opacity = '0.7';

            fetch(sheetCsvUrl)
                .then(res => res.text())
                .then(csvText => {
                    const rows = csvText.split('\n').map(r => r.split(','));
                    let found = null;

                    for (let i = 1; i < rows.length; i++) {
                        const r = rows[i];
                        if (r.length >= 3) {
                            const rawTracking = r[8] ? r[8].trim() : '';
                            const trackingId = rawTracking.toLowerCase();
                            const uid = r[2] ? r[2].trim().toLowerCase() : '';

                            if ((trackingId && trackingId === query) || (uid && uid === query)) {
                                let formattedTrackingId = rawTracking;
                                if (rawTracking.includes('http') || rawTracking.length > 15) {
                                    formattedTrackingId = 'TRK-' + Math.floor(10000 + Math.random() * 90000);
                                }

                                found = {
                                    name: r[0] ? r[0].trim() : 'N/A',
                                    uid: r[2] ? r[2].trim() : 'N/A',
                                    level: r[3] ? r[3].trim() : 'N/A',
                                    price: r[6] ? r[6].trim() : 'N/A',
                                    trackingId: formattedTrackingId,
                                    status: 'APPROVED & LIVE'
                                };
                                break;
                            }
                        }
                    }

                    resultBox.style.display = 'block';

                    if (found) {
                        resultBox.innerHTML = `
                            <div class="status-badge-wrap">
                                <span class="status-badge badge-approved">
                                    <span class="pulse-dot"></span> APPROVED & LIVE
                                </span>
                            </div>
                            <div class="details-grid">
                                <div class="detail-row">
                                    <span class="detail-label">Tracking ID:</span>
                                    <span class="detail-val tracking-code-highlight">${found.trackingId}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Account UID:</span>
                                    <span class="detail-val">${found.uid}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Seller Name:</span>
                                    <span class="detail-val">${found.name}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">Price:</span>
                                    <span class="detail-val price-highlight">Rs. ${found.price}</span>
                                </div>
                            </div>
                            <div class="status-msg-success">
                                🎉 Your account is verified and listed on the store!
                            </div>
                            <a href="index.html" class="view-store-btn">🛒 View Live Listing in Store</a>
                        `;
                    } else {
                        resultBox.innerHTML = `
                            <div class="status-badge-wrap">
                                <span class="status-badge badge-pending">
                                    ⏳ UNDER VERIFICATION
                                </span>
                            </div>
                            <div class="details-grid">
                                <div class="detail-row">
                                    <span class="detail-label">Search Query:</span>
                                    <span class="detail-val">${query.toUpperCase()}</span>
                                </div>
                            </div>
                            <p style="font-size:0.85rem; color:#94a3b8; margin-top:12px; line-height: 1.5;">Your submission is currently under review by our Admin team.</p>
                        `;
                    }

                    btn.innerText = '🔍 SEARCH STATUS';
                    btn.style.opacity = '1';
                })
                .catch(err => {
                    resultBox.style.display = 'block';
                    resultBox.innerHTML = `<div style="color: #ff003c; font-size: 0.9rem; text-align: center;">Failed to connect to Google Sheet. Try again.</div>`;
                    btn.innerText = '🔍 SEARCH STATUS';
                    btn.style.opacity = '1';
                });
        });
    </script>
</body>
</html>
