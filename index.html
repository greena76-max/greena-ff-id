<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews - FF STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        /* REVIEWS CONTAINER */
        .reviews-section {
            width: 100%;
            max-width: 520px;
            margin: 20px auto;
            text-align: center;
        }

        /* COMPACT HEADINGS */
        .reviews-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem; /* Compact Size */
            font-weight: 900;
            color: #dc2626;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            line-height: 1.25;
        }

        .reviews-subtitle {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .star-rating-static {
            color: #eab308;
            font-size: 1.15rem;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        /* FORM BOX */
        .review-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #ffffff;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .review-input, .review-textarea {
            width: 100%;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.85rem;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
        }

        .review-input:focus, .review-textarea:focus {
            background-color: #ffffff;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .review-textarea {
            height: 65px;
            resize: none;
        }

        .submit-review-btn {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
        }

        .submit-review-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(220, 38, 38, 0.3);
        }

        /* REVIEWS GRID / SLIDER PREVIEW */
        .reviews-feed {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-top: 20px;
            padding-bottom: 10px;
            width: 100%;
        }

        .review-card {
            min-width: 200px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 10px 12px;
            border-radius: 10px;
            text-align: left;
            font-size: 0.8rem;
        }

        .review-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .reviewer-name {
            font-weight: 700;
            color: #0f172a;
        }

        .reviewer-stars {
            color: #eab308;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="reviews-section">
        <h2 class="reviews-title">Customer Reviews & Feedback</h2>
        <p class="reviews-subtitle">Give us 5 Stars and share your experience!</p>
        
        <div class="star-rating-static">★★★★★</div>

        <form class="review-form" id="userReviewForm">
            <input type="text" class="review-input" placeholder="Your Name" required>
            <textarea class="review-textarea" placeholder="Write your review here..." required></textarea>
            <button type="submit" class="submit-review-btn">Submit 5-Star Review</button>
        </form>

        <!-- Dynamic Reviews Feed Preview -->
        <div class="reviews-feed">
            <div class="review-card">
                <div class="review-card-header">
                    <span class="reviewer-name">Muhammad Ibrahim</span>
                    <span class="reviewer-stars">★★★★★</span>
                </div>
            </div>
            <div class="review-card">
                <div class="review-card-header">
                    <span class="reviewer-name">Ali Raza</span>
                    <span class="reviewer-stars">★★★★★</span>
                </div>
            </div>
            <div class="review-card">
                <div class="review-card-header">
                    <span class="reviewer-name">Hamza Malik</span>
                    <span class="reviewer-stars">★★★★★</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('userReviewForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for your 5-star review!');
            this.reset();
        });
    </script>
</body>
</html>
