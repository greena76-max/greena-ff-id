<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Accounts Store</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #4a0000 0%, #8b0000 50%, #990000 100%);
            --card-bg: #ffffff;
            --text-dark: #1a1a1a;
            --primary-red: #8b0000;
            --accent-red: #d32f2f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        header {
            background: rgba(0, 0, 0, 0.4);
            text-align: center;
            padding: 25px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
            text-transform: uppercase;
            border-bottom: 2px solid #ff4d4d;
            display: inline-block;
            padding-bottom: 5px;
        }

        .title-wrapper {
            text-align: center;
        }

        /* Form Styling */
        .form-container {
            background: var(--card-bg);
            color: var(--text-dark);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            margin-bottom: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #333;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-red);
        }

        .submit-btn {
            grid-column: 1 / -1;
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--accent-red);
        }

        /* Accounts Cards Display */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            color: var(--text-dark);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #eee;
        }

        .card-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-red);
            margin-bottom: 10px;
        }

        .card-info {
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .card-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2e7d32;
            margin: 10px 0;
        }

        .buy-btn {
            display: block;
            text-align: center;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .buy-btn:hover {
            opacity: 0.9;
        }

        /* Tracker Section */
        .tracker-container {
            background: var(--card-bg);
            color: var(--text-dark);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 40px;
            text-align: center;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .search-box input {
            padding: 10px;
            width: 60%;
            max-width: 300px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .search-box button {
            padding: 10px 20px;
            background: var(--primary-red);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #statusResult {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Floating Live Chat Widget */
        .chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .chat-btn {
            background: #ffffff;
            color: var(--primary-red);
            border: 2px solid var(--primary-red);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-box-container {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 320px;
            height: 400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .chat-header {
            background: var(--primary-red);
            color: white;
            padding: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.3;
        }

        .msg-user {
            background: var(--primary-red);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-admin {
            background: #e0e0e0;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: #fff;
        }

        .chat-input-area input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        .chat-input-area button {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 8px 12px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Free Fire Account Store</h1>
    </header>

    <div class="container">

        <!-- SELL YOUR ID FORM -->
        <div class="form-container">
            <div class="title-wrapper">
                <h2 class="section-title">Sell Your Free Fire ID</h2>
            </div>
            <form id="sellForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Seller Name</label>
                        <input type="text" name="sellerName" required placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp Number</label>
                        <input type="text" name="whatsappNumber" required placeholder="e.g. 03478306672">
                    </div>
                    <div class="form-group">
                        <label>Free Fire UID</label>
                        <input type="text" name="freeFireUid" required placeholder="Enter FF UID">
                    </div>
                    <div class="form-group">
                        <label>Account Level</label>
                        <input type="number" name="accountLevel" required placeholder="e.g. 65">
                    </div>
                    <div class="form-group">
                        <label>Account Rank</label>
                        <input type="text" name="accountRank" required placeholder="Heroic / Master / Grandmaster">
                    </div>
                    <div class="form-group">
                        <label>Login Type</label>
                        <select name="loginType" required>
                            <option value="FB">Facebook</option>
                            <option value="Gmail">Gmail</option>
                            <option value="Twitter">Twitter</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price (PKR)</label>
                        <input type="number" name="accountPrice" required placeholder="Desired Price">
                    </div>
                    <div class="form-group">
                        <label>Screenshot Link (Drive/Imgur)</label>
                        <input type="url" name="screenshotLink" required placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Payment Proof Link</label>
                        <input type="url" name="paymentProofLink" required placeholder="https://...">
                    </div>
                    <button type="submit" id="subBtn" class="submit-btn">Submit For Approval</button>
                </div>
            </form>
        </div>

        <!-- SUBMISSION STATUS TRACKER -->
        <div class="tracker-container">
            <h3>Track Submission Status</h3>
            <div class="search-box">
                <input type="text" id="trackUidInput" placeholder="Enter your Free Fire UID">
                <button onclick="trackSubmissionStatus()">Track</button>
            </div>
            <div id="statusResult"></div>
        </div>

        <!-- AVAILABLE ACCOUNTS DISPLAY -->
        <div class="title-wrapper">
            <h2 class="section-title">Available Accounts</h2>
        </div>
        <div id="cardsGrid" class="cards-grid">
            <!-- Cards will be dynamically loaded here -->
        </div>

    </div>

    <!-- LIVE CHAT WIDGET -->
    <div class="chat-widget">
        <button class="chat-btn" onclick="toggleChat()">💬</button>
        <div class="chat-box-container" id="chatBoxContainer">
            <div class="chat-header">
                <span>Live Chat Support</span>
                <span style="cursor:pointer;" onclick="toggleChat()">✖</span>
            </div>
            <div class="chat-messages" id="chatBox">
                <!-- Chat messages appear here -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="userChatMsg" placeholder="Type a message...">
                <button onclick="sendWebMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONSTANTS (APKE URLS SET HAIN) ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwUuAlvc1tcBn2Fo0mJu8y5VD2EvAucqTPkqvhb2NwHhQ9wo9Otue6KFL2EVmU66tXK/exec';
        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxTNb36wRmt9K47cqS2sUa-4TqSZdzr_LzINKDN14MdHRB7VON2-K4tOyfiUwMMQXMeNSr8hxe06SO/pub?output=csv';

        // Chat Unique User ID
        let myChatId = localStorage.getItem('ff_chat_id');
        if (!myChatId) {
            myChatId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('ff_chat_id', myChatId);
        }

        // --- 1. FORM SUBMISSION ---
        const sellForm = document.getElementById('sellForm');
        const subBtn = document.getElementById('subBtn');

        sellForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            subBtn.disabled = true;
            subBtn.innerText = 'Submitting... Please Wait';

            fetch(scriptURL, { 
                method: 'POST', 
                body: new FormData(sellForm) 
            })
            .then(response => {
                alert('Success! Your ID details have been submitted for approval.');
                sellForm.reset();
                subBtn.disabled = false;
                subBtn.innerText = 'Submit For Approval';
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('Error submitting form!');
                subBtn.disabled = false;
                subBtn.innerText = 'Submit For Approval';
            });
        });

        // --- 2. LOAD CARDS FROM CSV ---
        let allAccountsData = [];

        async function loadIDs() {
            try {
                const response = await fetch(sheetCsvUrl + '&t=' + new Date().getTime());
                const data = await response.text();
                const rows = data.split('\n').map(row => row.split(','));
                
                const cardsGrid = document.getElementById('cardsGrid');
                cardsGrid.innerHTML = '';
                allAccountsData = [];

                // Assuming Headers are in row 0
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length >= 10) {
                        const seller = row[0]?.trim();
                        const whatsapp = row[1]?.trim();
                        const uid = row[2]?.trim();
                        const level = row[3]?.trim();
                        const rank = row[4]?.trim();
                        const login = row[5]?.trim();
                        const price = row[6]?.trim();
                        const img = row[7]?.trim();
                        const status = row[9]?.trim();

                        allAccountsData.push({ uid, status });

                        // Show only Approved accounts as cards
                        if (status && status.toLowerCase() === 'approved') {
                            const cardHTML = `
                                <div class="card">
                                    <img src="${img || 'https://via.placeholder.com/300x180?text=Free+Fire+ID'}" class="card-img" alt="FF ID">
                                    <div class="card-body">
                                        <div>
                                            <div class="card-title">Level ${level} - ${rank}</div>
                                            <div class="card-info"><strong>UID:</strong> ${uid}</div>
                                            <div class="card-info"><strong>Login:</strong> ${login}</div>
                                            <div class="card-price">PKR ${price}</div>
                                        </div>
                                        <a href="https://wa.me/923478306672?text=I%20want%20to%20buy%20FF%20ID%20UID:%20${uid}" target="_blank" class="buy-btn">Buy Now (WhatsApp)</a>
                                    </div>
                                </div>
                            `;
                            cardsGrid.innerHTML += cardHTML;
                        }
                    }
                }
            } catch (err) {
                console.error("Error loading accounts:", err);
            }
        }

        // --- 3. TRACK SUBMISSION STATUS ---
        function trackSubmissionStatus() {
            const uidInput = document.getElementById('trackUidInput').value.trim();
            const statusResult = document.getElementById('statusResult');
            
            if (!uidInput) {
                statusResult.innerText = "Please enter a valid UID!";
                statusResult.style.color = "yellow";
                return;
            }

            const found = allAccountsData.find(item => item.uid === uidInput);

            if (found) {
                statusResult.innerText = `Status for UID ${uidInput}: ${found.status}`;
                statusResult.style.color = found.status.toLowerCase() === 'approved' ? '#81c784' : '#ffb74d';
            } else {
                statusResult.innerText = "UID not found or Pending approval.";
                statusResult.style.color = "#ff8a80";
            }
        }

        // --- 4. LIVE CHAT SYSTEM ---
        function toggleChat() {
            const box = document.getElementById('chatBoxContainer');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        function sendWebMessage() {
            const msgInput = document.getElementById('userChatMsg');
            const msg = msgInput.value.trim();
            
            if (!msg) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg-bubble msg-user">${msg}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            msgInput.value = '';

            const formData = new FormData();
            formData.append('chatId', myChatId);
            formData.append('userMsg', msg);

            fetch(scriptURL, { 
                method: 'POST', 
                body: formData 
            }).catch(err => console.error('Chat error:', err));
        }

        async function checkAdminReplies() {
            try {
                const res = await fetch(scriptURL + '?t=' + new Date().getTime());
                const data = await res.json();
                
                const myMessages = data.filter(item => item.id === myChatId);
                const chatBox = document.getElementById('chatBox');

                if (myMessages.length > 0) {
                    chatBox.innerHTML = '';
                    myMessages.forEach(m => {
                        chatBox.innerHTML += `<div class="msg-bubble msg-user">${m.userMsg}</div>`;
                        if (m.adminReply) {
                            chatBox.innerHTML += `<div class="msg-bubble msg-admin">${m.adminReply}</div>`;
                        }
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch(e) {
                // Silent catch
            }
        }

        // Initial Load & Intervals
        loadIDs();
        setInterval(checkAdminReplies, 3000);
        setInterval(loadIDs, 10000);
    </script>
</body>
</html>
