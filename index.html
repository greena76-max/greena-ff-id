<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Free Fire ID Buy & Sell</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f4f5f8;
            /* Diamond Background Grid Pattern */
            background-image: radial-gradient(#d0d4dc 1px, transparent 1px);
            background-size: 20px 20px;
            color: #222;
        }

        /* Top Header Navigation */
        header {
            width: 100%;
            padding: 15px 30px;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: #d90429;
        }

        .track-btn {
            background: #111827;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Main Hero Section / Banner */
        .hero-banner {
            position: relative;
            max-width: 1100px;
            margin: 30px auto;
            padding: 40px 20px;
            text-align: center;
            overflow: hidden;
        }

        /* Free Fire Characters (Left and Right) */
        .hero-char {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 220px; /* Character Image Height */
            width: auto;
            object-fit: contain;
            z-index: 2;
            pointer-events: none;
        }

        .char-left {
            left: 20px;
        }

        .char-right {
            right: 20px;
        }

        /* Hero Text Styles */
        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: #e60000;
            text-shadow: 2px 2px 10px rgba(230, 0, 0, 0.2);
            margin-bottom: 5px;
        }

        .hero-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: #111;
            margin-bottom: 15px;
        }

        .hero-desc {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
        }

        /* Badges Row */
        .badges-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .badge {
            background: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #eee;
        }

        .badge-red {
            background: #e60000;
            color: #fff;
            border: none;
        }

        /* Controls / Search Bar Row */
        .controls-row {
            max-width: 900px;
            margin: 0 auto 30px auto;
            display: flex;
            gap: 15px;
            padding: 0 20px;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 0.95rem;
            background: #fff;
        }

        .sort-select {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 0.9rem;
            background: #fff;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .hero-char {
                display: none; /* Mobile screen par jagah kam hoti hai is liye hide ho jayega */
            }
            .hero-title {
                font-size: 2rem;
            }
            .hero-subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🔥 FF STORE</div>
        <a href="tracking.html" class="track-btn">🔍 Track Order</a>
    </header>

    <div class="hero-banner">
        <!-- LEFT CHARACTER IMAGE (Replace char-left.png with your image name) -->
        <img src="https://i.postimg.co/Hs9Zdr3C/IMG-20260730-WA0002.jpg" class="hero-char char-left" alt="FF Character Left">

        <!-- MAIN HEADER TEXT -->
        <h1 class="hero-title">WELCOME TO</h1>
        <h2 class="hero-subtitle">GARENA FREE FIRE ID BUY & SELL!</h2>
        <p class="hero-desc">Select your account and buy directly via WhatsApp</p>

        <!-- BADGES -->
        <div class="badges-container">
            <span class="badge">🔒 100% Safe Deals</span>
            <span class="badge badge-red">⚡ Fast Transfer</span>
            <span class="badge">✔ Admin Verified</span>
        </div>

        <!-- RIGHT CHARACTER IMAGE (Replace char-right.png with your image name) -->
        <img src="https://i.postimg.co/Hs9Zdr3C/IMG-20260730-WA0002.jpg" class="hero-char char-right" alt="FF Character Right">
    </div>

    <!-- SEARCH & SORT SECTION -->
    <div class="controls-row">
        <input type="text" class="search-input" placeholder="Search by UID or Level...">
        <select class="sort-select">
            <option value="">Sort by Price</option>
            <option value="low">Low to High</option>
            <option value="high">High to Low</option>
        </select>
    </div>

    <!-- Aap ke Accounts / Grid Items yahan se aage aayenge -->

</body>
</html>
