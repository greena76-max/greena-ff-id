<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube MP4 Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo-box {
            margin-bottom: 20px;
        }

        .logo-box svg {
            width: 60px;
            height: 60px;
            fill: #ff0000;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        button.btn-fetch {
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff0000;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button.btn-fetch:hover {
            background: #cc0000;
        }

        .preview-card {
            display: none;
            margin-top: 20px;
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
        }

        .preview-card img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: #22c55e;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #16a34a;
        }

        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo-box">
            <svg viewBox="0 0 24 24">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
        </div>

        <h1>YouTube Video Downloader</h1>
        <p class="subtitle">یوٹیوب ویڈیو کا لنک پیسٹ کریں اور MP4 میں ڈاؤن لوڈ کریں</p>

        <!-- Input Box -->
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
            <button class="btn-fetch" onclick="processDownload()">Download Video</button>
        </div>

        <div id="errorMsg" class="error-msg">براہِ کرم صحیح YouTube کا لنک درج کریں۔</div>

        <!-- Preview & Download Section -->
        <div class="preview-card" id="previewCard">
            <img id="thumbnail" src="" alt="Thumbnail">
            <a id="downloadLink" href="#" target="_blank" class="download-btn">📥 MP4 ڈاؤن لوڈ کریں</a>
        </div>
    </div>

    <script>
        function getYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function processDownload() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const previewCard = document.getElementById('previewCard');
            const thumbnail = document.getElementById('thumbnail');
            const downloadLink = document.getElementById('downloadLink');

            const videoId = getYouTubeID(urlInput);

            if (!videoId) {
                errorMsg.style.display = 'block';
                previewCard.style.display = 'none';
                return;
            }

            errorMsg.style.display = 'none';
            
            // Set Thumbnail Preview
            thumbnail.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

            // Third-Party Downloader Redirect (SSYouTube Bypass Method)
            const cleanUrl = `https://www.youtube.com/watch?v=${videoId}`;
            const downloadUrl = `https://www.ssyoutube.com/watch?v=${videoId}`;

            downloadLink.href = downloadUrl;
            previewCard.style.display = 'block';
        }
    </script>
</body>
</html>
