<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire ID Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --input-bg: #222227;
            --border-color: #33333d;
            --accent-color: #ff9900;
            --accent-hover: #e68a00;
            --text-main: #f0f0f5;
            --text-muted: #a0a0ab;
            --green: #00d26a;
            --red: #f8312f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navigation Header */
        header {
            width: 100%;
            background: #141418;
            border-bottom: 1px solid var(--border-color);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            background: #09090b;
            padding: 5px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        /* Main Content */
        .main-container {
            width: 100%;
            max-width: 1100px;
            padding: 30px 20px;
            flex-grow: 1;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* Form Styling */
        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            max-width: 450px;
            margin: 0 auto;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-control {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-control::placeholder {
            color: #6c6c7d;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a0a0ab' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        .submit-btn {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🔥 FF STORE</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('buy')">Buy ID</button>
            <button class="tab-btn" onclick="switchTab('sell')">Sell ID</button>
        </div>
    </header>

    <div class="main-container">
        
        <!-- BUY SECTION -->
        <div id="buy-section" class="section active">
            <h2 class="section-title">Available Free Fire IDs</h2>
            <p class="section-subtitle">Select your account and buy directly via WhatsApp</p>
            <div style="text-align:center; padding: 40px; color: var(--text-muted);">
                <h3>No IDs uploaded yet!</h3>
                <p>IDs added to Google Sheet will show here.</p>
            </div>
        </div>

        <!-- SELL SECTION -->
        <div id="sell-section" class="section">
            <h2 class="section-title">Sell Your Account</h2>
            <p class="section-subtitle">Fill out the form below to list your Free Fire ID</p>

            <div class="form-card">
                <form id="sellForm">
                    <div class="form-group">
                        <input type="text" name="sellerName" class="form-control" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" name="whatsappNumber" class="form-control" placeholder="WhatsApp Number" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="freeFireUid" class="form-control" placeholder="Free Fire UID" required>
                    </div>
                    <div class="form-group">
                        <input type="number" name="accountLevel" class="form-control" placeholder="Level" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="accountRank" class="form-control" placeholder="Rank (e.g. Heroic, Grandmaster)" required>
                    </div>
                    <div class="form-group">
                        <select name="loginType" class="form-control" required>
                            <option value="" disabled selected hidden>Google / Facebook</option>
                            <option value="Google">Google</option>
                            <option value="Facebook">Facebook</option>
                            <option value="VK">VK</option>
                            <option value="Twitter">Twitter</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="text" name="accountPrice" class="form-control" placeholder="Price (PKR)" required>
                    </div>
                    <div class="form-group">
                        <input type="url" name="screenshotLink" class="form-control" placeholder="Screenshot Link (Drive / Imgur)" required>
                    </div>
                    <button type="submit" class="submit-btn" id="subBtn">Submit Account Details</button>
                </form>
            </div>
        </div>

    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

            if(tab === 'buy') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('buy-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('sell-section').classList.add('active');
            }
        }

        const scriptURL = 'https://script.google.com/macros/s/AKfycbzsLu9ffslDBNI7T7Grxw3yyRGgh91xVPIvYRZl4s0RH47Tcyc_E6Ia6xjDVv9-AqiW/exec';
        const form = document.getElementById('sellForm');
        const btn = document.getElementById('subBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.innerText = 'Submitting...';
            btn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    alert('Success! Data Google Sheet me save ho gaya hai.');
                    form.reset();
                    btn.innerText = 'Submit Account Details';
                    btn.disabled = false;
                })
                .catch(error => {
                    alert('Error! Data send nahi ho saka.');
                    btn.innerText = 'Submit Account Details';
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
